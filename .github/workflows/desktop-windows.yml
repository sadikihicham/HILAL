name: Desktop · build Windows (.exe)

# Build manuel (workflow_dispatch) ou sur tag `desktop-vX.Y.Z`.
# IMPORTANT : ne se déclenche PAS sur push master — n'interfère donc pas avec
# eas-update.yml (OTA mobile). Produit l'installeur NSIS (.exe) en artefact, ET —
# sur un tag — le publie dans une Release GitHub (voir la dernière étape).
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    # `gh release create/upload` écrit sur le dépôt : sans ceci le token est
    # en lecture seule et la publication échoue en 403.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS deps
        run: npm install

      - name: Tests (logique pure)
        run: npm test

      - name: Garde anti-réseau (invariant zéro réseau sortant)
        shell: bash
        run: |
          if grep -rniE "fetch\(|XMLHttpRequest|WebSocket|axios|sendBeacon|EventSource" src; then
            echo "::error::Appel réseau détecté dans desktop/src — invariant zéro réseau violé"
            exit 1
          fi
          echo "OK : aucun appel réseau dans desktop/src"

      # `tauri build` lance `beforeBuildCommand` (npm run build = tsc + vite),
      # puis compile le binaire Rust et l'installeur NSIS.
      # --bundles nsis : on fige le bundle (la config `targets` vaut "all").
      - name: Build (.exe + installeur NSIS)
        run: npm run tauri:build -- --bundles nsis

      - name: Upload artefacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: hilal-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/hilal-desktop.exe
          if-no-files-found: error

      # ───────────────────────────────────────────────── publication de la Release
      # Miroir exact de l'étape de `desktop-macos.yml` — voir ses commentaires pour le
      # raisonnement complet (un artefact périssable et fermé n'est pas un canal de
      # distribution). Seul l'installeur NSIS est attaché : le `hilal-desktop.exe` brut
      # reste dans l'artefact, il n'a pas sa place dans une page de téléchargement.
      #
      # 🪤 `shell: bash` sur `windows-latest` = Git Bash : le glob `*.exe` y est bien
      #    développé, ce que PowerShell ne ferait pas de la même façon.
      # 🪤 Les deux workflows visent la MÊME Release en parallèle : `create` échoue pour
      #    le second, d'où le `|| echo`. `--clobber` rend l'étape rejouable.
      # 🔒 Le nom du tag passe par `$GITHUB_REF_NAME` (variable d'environnement), jamais
      #    par une interpolation `${{ }}` dans le shell : pas de surface d'injection.
      - name: Publier la Release (tag uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Sans `failglob`, un glob sans correspondance est passé LITTÉRALEMENT à `gh`,
          # qui échoue alors sur un message incompréhensible. Vérifié en simulation.
          shopt -s failglob
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" \
            --title "HILAL Desktop ${TAG#desktop-v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            || echo "Release déjà créée (probablement par le build macOS) — on enchaîne."
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
