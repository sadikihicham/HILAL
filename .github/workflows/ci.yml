name: CI

# Portes bloquantes sur CHAQUE PR — un job par produit, car le dépôt en contient
# deux : l'app mobile Expo (racine) et l'app desktop Tauri (`desktop/`), qui ont
# des toolchains et des `tsconfig` disjoints (`tsconfig.json` racine exclut
# `desktop/`). Le job `gates` ne couvre donc QUE le mobile : sans les jobs
# `gates-desktop*`, les ~1 500 lignes de `desktop/` ne seraient testées nulle part
# avant un tag de release. Ne publie RIEN — l'OTA reste gérée exclusivement par
# `eas-update.yml` sur push master.
#
# ⚠️ `gates` est le "required status check" de la branch protection de master :
# NE PAS le renommer sans mettre à jour la règle côté GitHub. Pour rendre les
# nouveaux jobs bloquants eux aussi, les ajouter à la même règle.
#
# Aucun job n'a de filtre `paths` : un job requis qui ne démarre jamais reste
# "pending" pour la branch protection et bloquerait la PR indéfiniment.
on:
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────── mobile (Expo, racine du dépôt)
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ──────────────────────────────────── desktop — frontend (rapide, échoue vite)
  gates-desktop:
    name: gates (desktop · front)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      # `npm run build` = `tsc --noEmit && vite build` : type-check strict PUIS
      # bundle réel (un import cassé ne se voit qu'au bundling).
      - name: Type-check + build
        run: npm run build

      - name: Tests (logique pure + parité des 3 langues)
        run: npm test

      # Même garde que le workflow de release, mais jouée sur CHAQUE PR : sans
      # elle un `fetch(` n'était détecté qu'au tag, donc trop tard.
      #
      # 🔴 Étendue au Rust le 2026-09-04. Elle ne couvrait que `desktop/src` (le front),
      #    soit la MOITIÉ du produit : le moteur Rust pouvait ouvrir une connexion sans
      #    qu'aucune porte ne le voie — et `reqwest` est bien présent dans `Cargo.lock`,
      #    tiré transitivement par Tauri. La note de Release affirme l'invariant aux
      #    utilisateurs ; il fallait que la porte le vérifie vraiment.
      # 🪤 Motif Rust volontairement ÉTROIT : `std::net` en est EXCLU, car `main.rs`
      #    s'en sert pour FORMATER une adresse IP locale (`std::net::IpAddr::V4`, sans
      #    aucune connexion). Un motif large casserait la CI sur du code parfaitement sain.
      - name: Garde anti-réseau (invariant zéro réseau sortant)
        run: |
          if grep -rniE "fetch\(|XMLHttpRequest|WebSocket|axios|sendBeacon|EventSource" src; then
            echo "::error::Appel réseau détecté dans desktop/src — invariant zéro réseau violé"
            exit 1
          fi
          if grep -rniE "reqwest|ureq|hyper::|TcpStream|TcpListener|UdpSocket|to_socket_addrs" src-tauri/src; then
            echo "::error::Appel réseau détecté dans desktop/src-tauri/src — invariant zéro réseau violé"
            exit 1
          fi
          echo "OK : aucun appel réseau dans desktop/src ni desktop/src-tauri/src"

  # ─────────────────── desktop — backend Rust (plus lent, isolé pour le diagnostic)
  # `cargo check` fait tourner `tauri-build`, qui PARSE `tauri.conf.json` et compile
  # les `capabilities/*.json` en ACL. C'est la seule porte qui attrape une clé de
  # config invalide ou un identifiant de permission inexistant — jusqu'ici ces deux
  # fichiers n'avaient aucune couverture avant le build de release.
  gates-desktop-rust:
    name: gates (desktop · rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      # Prérequis Tauri 2 sous Ubuntu (WebKitGTK & co). Le binaire Linux n'est pas
      # distribué, mais la compilation valide le code Rust ET la config Tauri, qui
      # sont multiplateformes.
      - name: Dépendances système Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: cargo check (valide aussi tauri.conf.json + capabilities)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # Ajouté le 2026-09-03 avec les modules thermique/processus/énergie. Ces tests
      # couvrent ce qu'aucune relecture n'attrape : les DISPOSITIONS BINAIRES du
      # protocole SMC (80 octets) et de `rusage_info_v6` (464 octets). Un décalage y
      # ferait lire un autre champ — donnée fausse, jamais une erreur. Les tests
      # spécifiques à macOS sont exclus par `cfg` et ne tournent pas ici ; le test
      # d'énumération des processus, lui, s'exécute bien sous Linux — les autres sont
      # couverts par `gates-desktop-rust-macos` ci-dessous.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # ──────────────────────────── desktop — backend Rust SUR macOS (le FFI, enfin testé)
  # Ajouté le 2026-09-04. Le job Linux ci-dessus compile 8 des 16 tests seulement :
  # tout `smc.rs` (`#![cfg(target_os = "macos")]`) et tout le `mod tests` de
  # `energy.rs` (`cfg(all(test, target_os = "macos"))`) étaient exclus, donc
  # exécutés NULLE PART. Deux tests de `procs.rs` tournaient bien sous Linux mais y
  # perdaient leur assertion énergie, elle aussi gardée par `cfg`.
  #
  # Ce qu'ils protègent n'est pas rattrapable autrement : des DISPOSITIONS BINAIRES
  # codées en dur (offsets de `rusage_info_v6`, trame SMC de 80 octets) face à des
  # en-têtes système que nous ne contrôlons pas. Un décalage y lit un champ voisin —
  # la valeur reste plausible, aucune erreur n'est levée, l'interface affiche des
  # watts faux avec aplomb. C'est exactement le type de bug qu'une porte doit tenir.
  #
  # Volontairement SÉPARÉ du job Linux plutôt qu'une matrice : Linux valide en plus
  # les dépendances GTK et sert de garde à la portabilité du code non gardé par `cfg`.
  # Une matrice masquerait lequel des deux a cassé.
  gates-desktop-rust-macos:
    name: gates (desktop · rust macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Pas de `cargo check` ici : le job Linux le fait déjà et c'est lui qui valide
      # `tauri.conf.json`. L'apport de macOS est l'EXÉCUTION des tests gardés `cfg`.
      - name: cargo test (dont SMC + énergie, invisibles sous Linux)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
