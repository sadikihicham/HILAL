name: EAS Update

# Publie le bundle JS (OTA) sur le projet EAS à chaque push sur master.
# Prérequis : ajouter le secret EXPO_TOKEN dans GitHub
# (Settings → Secrets and variables → Actions), généré sur
# expo.dev → Account → Settings → Access tokens.
on:
  push:
    branches: [master]
    # Un push qui ne touche QUE ces chemins ne republie pas le bundle mobile :
    # ils ne peuvent pas changer le JS embarqué par Expo.
    #   - desktop/**  : l'app desktop Tauri est un produit séparé (binaires
    #                   construits par desktop-build.yml, sur tag uniquement).
    #   - .github/**  : modifier un workflow ne change pas le bundle. Sans cette
    #                   ligne, toute PR qui touche à la CI et au desktop
    #                   déclencherait quand même l'OTA, ce qui viderait de son sens
    #                   l'exclusion de `desktop/**`.
    # `paths-ignore` ne s'applique PAS à workflow_dispatch : le déclenchement
    # manuel reste toujours disponible pour forcer une OTA.
    paths-ignore:
      - 'desktop/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  # Porte bloquante : type-check TypeScript strict + tests unitaires.
  # Si elle échoue, l'OTA n'est PAS publiée (update a un `needs: check`).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  update:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish update
        # Message passe par l'env (pas d'interpolation directe dans le shell :
        # un message de commit non maitrise pourrait casser/injecter la commande).
        # Fallback sur le SHA : head_commit.message est vide en declenchement manuel.
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: eas update --branch preview --message "$UPDATE_MESSAGE" --non-interactive
