name: HILALWatch
options:
  bundleIdPrefix: com.sadikihicham.hilal
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  HILALWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadikihicham.hilal.watch
        PRODUCT_NAME: HILAL
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HILAL
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        TARGETED_DEVICE_FAMILY: '4'
